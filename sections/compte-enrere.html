<section class="py-16">
  <div class="container mx-auto px-6">
    <h2 class="text-4xl font-bold text-center mb-8 section-title">Compte enrere</h2>
    <div class="glass-effect max-w-4xl mx-auto p-8 rounded-lg text-center bg-white">
      <p id="event-name" class="countdown-event">Carregant...</p>
      <p id="event-date" class="countdown-date mb-6"></p>
      <div class="grid grid-cols-4 gap-4 max-w-md mx-auto">
        <div class="countdown-box">
          <div id="days" class="text-3xl">0</div>
          <div class="countdown-label">dies</div>
        </div>
        <div class="countdown-box">
          <div id="hours" class="text-3xl">0</div>
          <div class="countdown-label">hores</div>
        </div>
        <div class="countdown-box">
          <div id="minutes" class="text-3xl">0</div>
          <div class="countdown-label">minuts</div>
        </div>
        <div class="countdown-box">
          <div id="seconds" class="text-3xl">0</div>
          <div class="countdown-label">segons</div>
        </div>
      </div>
    </div>
  </div>
</section>
